# Local wrapper around the Sensy-One release configuration.
# Move this ref to a newer release tag only after reviewing its YAML changes.
substitutions:
  sensy_one_version: v1.2.21

packages:
  sensy_one:
    url: https://github.com/sensy-one/S1-Pro-Multi-Sense
    ref: ${sensy_one_version}
    files:
      - assets/source/main.yaml
    refresh: never

# Per-device identity (overrides the values in the imported package).
esphome:
  name: presence-kuche
  friendly_name: Presence Küche
  name_add_mac_suffix: false

api:
  encryption:
    key: !secret presence_kuche__encryption_key

# Do not advertise this customized device as an adoption template.
dashboard_import: !remove

# The upstream package currently loads s1_pro from main. Load the matching
# release version after it so this source takes precedence during compilation.
external_components:
  - source:
      type: git
      url: https://github.com/sensy-one/S1-Pro-Multi-Sense
      ref: ${sensy_one_version}
      path: assets/source/components
    components: [s1_pro]
    refresh: never

# The upstream release uses the now-obsolete rgb_order option,
# so remove it while extending the same light entity.
light:
  - id: !extend ws2812_LED
    rgb_order: !remove
    channel_colors: GRB
